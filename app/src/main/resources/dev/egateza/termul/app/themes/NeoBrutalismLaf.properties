# Tema Neobrutalism (mode terang): krem + kuning, border hitam tebal, sudut membulat, bayangan keras tanpa blur,
# aksen multiwarna (ungu, lime, pink, cyan, merah)
@ink = #000000
@cream = #FFF4E8
@paper = #FFEFC2
@yellow = #FFDE00
@purple = #C4A1FF
@lime = #B8F26B
@pink = #F4A7F0
@cyan = #74CEE4
@red = #F25B4A

@background = @cream
@foreground = @ink
@accentColor = @ink
@selectionBackground = @yellow
@selectionForeground = @ink
@selectionInactiveBackground = @paper
@selectionInactiveForeground = @ink

# border hitam tebal + sudut membulat seperti kartu; field berbentuk pil
Component.borderColor = @ink
Component.disabledBorderColor = #9A9A9A
Component.borderWidth = 2
Component.arc = 14
Component.focusWidth = 2
Component.innerFocusWidth = 0
Component.focusColor = @purple
Component.focusedBorderColor = @ink
Button.arc = 14
TextComponent.arc = 999
CheckBox.arc = 6
CheckBox.icon.borderColor = @ink
CheckBox.icon.checkmarkColor = @ink
CheckBox.icon.selectedBackground = @yellow
CheckBox.icon.selectedBorderColor = @ink

# tombol: bayangan keras di bawah (butuh Component.focusWidth > 0)
Button.borderWidth = 2
Button.default.borderWidth = 2
Button.borderColor = @ink
Button.background = #FFFFFF
Button.hoverBackground = @lime
Button.pressedBackground = #9EDB4F
Button.paintShadow = true
Button.shadowWidth = 3
Button.shadowColor = @ink
Button.default.shadowColor = @ink
Button.default.background = @yellow
Button.default.foreground = @ink
Button.default.borderColor = @ink
Button.default.focusedBorderColor = @ink
Button.default.hoverBackground = #FFE94D
Button.default.pressedBackground = #F2CC00
Button.default.boldText = true
Button.toolbar.hoverBackground = @yellow
Button.toolbar.pressedBackground = #F2CC00

# popup: tanpa blur, border hitam
Popup.dropShadowPainted = false
PopupMenu.borderColor = @ink
PopupMenu.borderInsets = 4,2,4,2
MenuBar.background = @cream
MenuBar.borderColor = @ink
MenuItem.selectionBackground = @yellow
MenuItem.selectionForeground = @ink
Menu.selectionBackground = @yellow
Menu.selectionForeground = @ink
Separator.foreground = @ink

# tab: tab aktif kuning dengan garis bawah hitam tebal
TabbedPane.background = @cream
TabbedPane.selectedBackground = @yellow
TabbedPane.underlineColor = @ink
TabbedPane.inactiveUnderlineColor = @ink
TabbedPane.tabSelectionHeight = 4
TabbedPane.hoverColor = @paper
TabbedPane.focusColor = @yellow
TabbedPane.showTabSeparators = true
TabbedPane.tabSeparatorsFullHeight = true
TabbedPane.contentAreaColor = @ink
SplitPane.background = @cream
SplitPaneDivider.gripColor = @ink
TitlePane.background = @cream

# scrollbar: thumb hitam berbentuk pil
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2,3,2,3
ScrollBar.thumb = @ink
ScrollBar.hoverThumbColor = #333333
ScrollBar.pressedThumbColor = @purple
ScrollBar.track = @cream

# daftar/tree/tabel
Tree.background = #FFFFFF
Tree.selectionBackground = @yellow
Tree.selectionForeground = @ink
List.selectionBackground = @yellow
List.selectionForeground = @ink
Table.selectionBackground = @yellow
Table.selectionForeground = @ink
Table.gridColor = @ink
TableHeader.background = @pink
TableHeader.separatorColor = @ink
TableHeader.bottomSeparatorColor = @ink
ProgressBar.foreground = @red
ProgressBar.background = #FFFFFF
ProgressBar.arc = 999
ToolTip.background = @yellow
ToolTip.foreground = @ink
ToolTip.border = 4,6,4,6,@ink
