# Tema Flat Illustration (hanya mode terang)
@ink = #1E2430
@yellow = #FFC93C
@teal = #22B99A
@violet = #4B3FD1
@pink = #F06CE6
@softGray = #F3F4F8

@background = #FFFFFF
@foreground = @ink
@accentColor = @violet
@selectionBackground = #FFE6A3
@selectionForeground = @ink
@selectionInactiveBackground = #F5F0DC
@selectionInactiveForeground = @ink

# border tegas + sudut membulat
Component.borderColor = @ink
Component.disabledBorderColor = #B9BECB
Component.focusColor = @violet
Component.focusedBorderColor = @violet
Component.arc = 12
Button.arc = 12
TextComponent.arc = 12
CheckBox.arc = 6
ScrollBar.thumbArc = 999
ScrollBar.thumb = #C9CCD8
ScrollBar.hoverThumbColor = @ink

# tombol utama: kuning seperti tombol pada ilustrasi
Button.borderColor = @ink
Button.background = #FFFFFF
Button.hoverBackground = @softGray
Button.default.background = @yellow
Button.default.foreground = @ink
Button.default.borderColor = @ink
Button.default.hoverBackground = #FFD661
Button.toolbar.hoverBackground = @softGray
Button.toolbar.pressedBackground = #E4E6EE

# menu, tab, panel
MenuBar.background = #FFFFFF
MenuBar.borderColor = @ink
MenuItem.selectionBackground = #FFE6A3
MenuItem.selectionForeground = @ink
PopupMenu.borderColor = @ink
Separator.foreground = #D5D8E2
TabbedPane.background = #FFFFFF
TabbedPane.underlineColor = @teal
TabbedPane.inactiveUnderlineColor = @teal
TabbedPane.selectedBackground = #FFFFFF
TabbedPane.hoverColor = @softGray
TabbedPane.focusColor = #FFF3D0
SplitPane.background = #FFFFFF
SplitPaneDivider.gripColor = @ink
TitlePane.background = #FFFFFF

# daftar/tree/tabel
Tree.background = #FFFFFF
Tree.selectionBackground = #FFE6A3
Tree.selectionForeground = @ink
List.selectionBackground = #FFE6A3
List.selectionForeground = @ink
Table.selectionBackground = #FFE6A3
Table.selectionForeground = @ink
Table.gridColor = #E4E6EE
TableHeader.background = @softGray
ProgressBar.foreground = @teal
ToolTip.background = @ink
ToolTip.foreground = #FFFFFF
