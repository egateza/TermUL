# Tema Neobrutalism (mode gelap): border krem menggantikan hitam supaya tetap kontras; aksen sama dengan mode terang
@ink = #F5F0E1
@shade = #000000
@charcoal = #1C1C1F
@surface = #26262B
@yellow = #FFDE00
@purple = #C4A1FF
@lime = #B8F26B
@pink = #F4A7F0
@red = #F25B4A
@onAccent = #000000

@background = @charcoal
@foreground = @ink
@accentColor = @yellow
@selectionBackground = @yellow
@selectionForeground = @onAccent
@selectionInactiveBackground = #4A4535
@selectionInactiveForeground = @ink

# border tebal + sudut membulat; field berbentuk pil
Component.borderColor = @ink
Component.disabledBorderColor = #5C5C63
Component.borderWidth = 2
Component.arc = 14
Component.focusWidth = 2
Component.innerFocusWidth = 0
Component.focusColor = @purple
Component.focusedBorderColor = @ink
Button.arc = 14
TextComponent.arc = 999
CheckBox.arc = 6
CheckBox.icon.borderColor = @ink
CheckBox.icon.checkmarkColor = @onAccent
CheckBox.icon.selectedBackground = @yellow
CheckBox.icon.selectedBorderColor = @ink

# tombol: bayangan keras di bawah (butuh Component.focusWidth > 0)
Button.borderWidth = 2
Button.default.borderWidth = 2
Button.borderColor = @ink
Button.background = @surface
Button.foreground = @ink
Button.hoverBackground = #34343B
Button.pressedBackground = #3F3F47
Button.paintShadow = true
Button.shadowWidth = 3
Button.shadowColor = @shade
Button.default.shadowColor = @shade
Button.default.background = @yellow
Button.default.foreground = @onAccent
Button.default.borderColor = @ink
Button.default.focusedBorderColor = @ink
Button.default.hoverBackground = #FFE94D
Button.default.pressedBackground = #F2CC00
Button.default.boldText = true
Button.toolbar.hoverBackground = #34343B
Button.toolbar.pressedBackground = #3F3F47

# popup: tanpa blur, border krem
Popup.dropShadowPainted = false
PopupMenu.borderColor = @ink
PopupMenu.borderInsets = 4,2,4,2
MenuBar.background = @charcoal
MenuBar.borderColor = @ink
MenuItem.selectionBackground = @yellow
MenuItem.selectionForeground = @onAccent
Menu.selectionBackground = @yellow
Menu.selectionForeground = @onAccent
Separator.foreground = @ink

# tab: garis bawah kuning tebal
TabbedPane.background = @charcoal
TabbedPane.selectedBackground = @surface
TabbedPane.underlineColor = @yellow
TabbedPane.inactiveUnderlineColor = @ink
TabbedPane.tabSelectionHeight = 4
TabbedPane.hoverColor = #34343B
TabbedPane.focusColor = @surface
TabbedPane.showTabSeparators = true
TabbedPane.tabSeparatorsFullHeight = true
TabbedPane.contentAreaColor = @ink
SplitPane.background = @charcoal
SplitPaneDivider.gripColor = @ink
TitlePane.background = @charcoal

# scrollbar: thumb krem berbentuk pil
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2,3,2,3
ScrollBar.thumb = #8C887C
ScrollBar.hoverThumbColor = @ink
ScrollBar.pressedThumbColor = @purple
ScrollBar.track = @charcoal

# daftar/tree/tabel
Tree.background = @surface
Tree.selectionBackground = @yellow
Tree.selectionForeground = @onAccent
List.selectionBackground = @yellow
List.selectionForeground = @onAccent
Table.selectionBackground = @yellow
Table.selectionForeground = @onAccent
Table.gridColor = #5C5C63
TableHeader.background = @surface
TableHeader.separatorColor = @ink
TableHeader.bottomSeparatorColor = @ink
ProgressBar.foreground = @lime
ProgressBar.background = @surface
ProgressBar.arc = 999
ToolTip.background = @yellow
ToolTip.foreground = @onAccent
ToolTip.border = 4,6,4,6,@shade
