# Tema Neobrutalism Retro (hanya mode terang): kertas krem, tinta hitam, sudut membulat, tombol pil, datar tanpa
# bayangan, aksen retro-komik
@ink = #1C1A17
@paper = #F2E3CE
@card = #F8EDDD
@orange = #EE7A2B
@pink = #F28AB8
@teal = #5FAF9C
@blue = #7F9BE0
@mustard = #F4BE45

@background = @paper
@foreground = @ink
@accentColor = @orange
@selectionBackground = @mustard
@selectionForeground = @ink
@selectionInactiveBackground = #EAD3A8
@selectionInactiveForeground = @ink

# border tinta + sudut membulat seperti kartu; tombol dan field berbentuk pil
Component.borderColor = @ink
Component.disabledBorderColor = #A89D8D
Component.borderWidth = 2
Component.arc = 16
Component.focusWidth = 0
Component.innerFocusWidth = 1
Component.focusColor = @orange
Component.focusedBorderColor = @orange
Button.arc = 999
TextComponent.arc = 999
CheckBox.arc = 6
CheckBox.icon.borderColor = @ink
CheckBox.icon.checkmarkColor = @ink
CheckBox.icon.selectedBackground = @mustard
CheckBox.icon.selectedBorderColor = @ink

# tombol: datar, tombol utama mustard
Button.borderWidth = 2
Button.default.borderWidth = 2
Button.borderColor = @ink
Button.background = @card
Button.hoverBackground = @pink
Button.pressedBackground = #E06FA2
Button.focusedBorderColor = @orange
Button.default.background = @mustard
Button.default.foreground = @ink
Button.default.borderColor = @ink
Button.default.focusedBorderColor = @orange
Button.default.hoverBackground = #F7CC66
Button.default.pressedBackground = #E5AB2E
Button.default.boldText = true
Button.toolbar.hoverBackground = @mustard
Button.toolbar.pressedBackground = #E5AB2E

# popup: tanpa blur, border tinta
Popup.dropShadowPainted = false
PopupMenu.borderColor = @ink
PopupMenu.borderInsets = 4,2,4,2
MenuBar.background = @paper
MenuBar.borderColor = @ink
MenuItem.selectionBackground = @orange
MenuItem.selectionForeground = @ink
Menu.selectionBackground = @orange
Menu.selectionForeground = @ink
Separator.foreground = @ink

# tab: tab aktif oranye dengan garis bawah tinta
TabbedPane.background = @paper
TabbedPane.selectedBackground = @orange
TabbedPane.underlineColor = @ink
TabbedPane.inactiveUnderlineColor = @ink
TabbedPane.tabSelectionHeight = 3
TabbedPane.hoverColor = @card
TabbedPane.focusColor = @orange
TabbedPane.showTabSeparators = true
TabbedPane.tabSeparatorsFullHeight = true
TabbedPane.contentAreaColor = @ink
SplitPane.background = @paper
SplitPaneDivider.gripColor = @ink
TitlePane.background = @paper

# scrollbar: thumb tinta berbentuk pil
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumbInsets = 2,3,2,3
ScrollBar.thumb = @ink
ScrollBar.hoverThumbColor = #4A453E
ScrollBar.pressedThumbColor = @orange
ScrollBar.track = @paper

# daftar/tree/tabel
Tree.background = @card
Tree.selectionBackground = @mustard
Tree.selectionForeground = @ink
List.selectionBackground = @mustard
List.selectionForeground = @ink
Table.selectionBackground = @mustard
Table.selectionForeground = @ink
Table.gridColor = @ink
TableHeader.background = @teal
TableHeader.separatorColor = @ink
TableHeader.bottomSeparatorColor = @ink
ProgressBar.foreground = @blue
ProgressBar.background = @card
ProgressBar.arc = 999
ToolTip.background = @ink
ToolTip.foreground = @paper
ToolTip.border = 4,6,4,6,@ink
